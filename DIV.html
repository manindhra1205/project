<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIV</title>
    <style>
        body,html{
            margin: 10px 10px 10px 10px;
        }
        .div{
            height: 200px;
            width: 300px;
            background-color:dodgerblue;
            text-align: center;
            text-shadow: 1px;
            border-radius: 5px;
            position: absolute;
            left: 40%;
            top: 40%;
        }
    </style>
</head>
<body>
    <div class="div">center a div</div>
</body>
</html>
